# Included in every location: nginx drops inherited add_header directives when a location defines its own.
# TLS terminates at the load balancer; HSTS keeps browsers on HTTPS. The inline theme script in index.html is pinned by hash.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-uzrkLloPUtqKcZPt/0JDd/vkTOjz0KhATpN8oB9c8G8='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
