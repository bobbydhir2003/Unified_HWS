# Behind the Caddy TLS edge (EC2) the real client address/scheme arrive in X-Forwarded-*; trust them only from the
# private Docker network. Locally (no edge) $scheme/$remote_addr are used as before.
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }

server {
  listen 80;
  server_tokens off;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Forwarded-For;
  client_max_body_size 30m;

  location /api/ {
    include /etc/nginx/conf.d/security-headers.inc;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 120s;
  }
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.inc;
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location / {
    include /etc/nginx/conf.d/security-headers.inc;
    root /usr/share/nginx/html;
    try_files $uri /index.html;
    add_header Cache-Control "no-store";
  }
}
