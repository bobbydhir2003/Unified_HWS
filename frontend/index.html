<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>HMS Workflows</title>
    <meta name="description" content="HMS Workflows — Your Entire Hospital. Working as One." />
    <meta name="theme-color" content="#0B2545" />
    <script>
      try {
        const t = localStorage.getItem("ud-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
        if (localStorage.getItem("ud-density") === "compact") document.documentElement.dataset.density = "compact";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
