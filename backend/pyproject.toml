[project]
name = "undeclared-api"
version = "0.1.0"
description = "Undeclared EHR platform API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pyjwt>=2.10",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "redis>=5.2",
  "celery>=5.4",
  "python-multipart>=0.0.17",
  "boto3>=1.35",
  "httpx>=0.28",
  "packaging>=24",
  "anthropic>=2.10.0",
  "pypdf>=7.1.1",
  "fpdf2>=2.9.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "UP046"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
